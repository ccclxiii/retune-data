# Every morning: the Greek podcasts list, fresh from each show's own feed (podcasts/build.mjs).
name: Greek podcasts list

on:
  schedule:
    # 04:23 UTC = 06:23 in Greece in winter, 07:23 in summer.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcasts
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node podcasts/build.mjs
      - name: Save today's list
        run: |
          if git diff --quiet -- podcasts/popular-gr.json; then
            echo "No change today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcasts/popular-gr.json
          git commit -m "Greek podcasts list for $(date -u +%F)"
          git push
